# Alembic configuration for the developer and operator workflow. The
# database Funes owns is migrated by two independent environments, each
# tracking its own version table; apply both, in either order:
#
#   alembic -n pravda upgrade head    # Pravda's packaged migrations
#   alembic -n funes upgrade head     # Funes's own migrations
#
# Pravda's scripts resolve inside the installed package via the
# ``pravda:migrations`` package-resource syntax; Funes's live in the source
# tree. Each environment takes its database URL from `sqlalchemy.url` in
# this configuration if set, else from its own environment variable:
# FUNES_DATABASE_URI for [funes], PRAVDA_DATABASE_URI for [pravda]
# (see the env.py scripts); a deployment points both at the same database.

[DEFAULT]
# Make the source tree importable so env.py can ``from funes.db import ...``.
prepend_sys_path = %(here)s

[pravda]
script_location = pravda:migrations

[funes]
script_location = %(here)s/funes/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
