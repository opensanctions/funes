        jurisdiction: Thornwick
        start_date: Jan, 2026
- name: bot_challenge
  inputs:
    fixture: bot_challenge
    url: https://www.nw-tribunal.example.org/secretariat/council
    objective: Identify the judges and officeholders of the Northwest Tribunal's
      secretariat council.
  expected_output:
    kind: broken
    reason: Bot-detection security challenge interstitial ("Just a moment...",
      "verifies you are not a bot"); no usable source content.
- name: elections_no_holders
  inputs:
    fixture: elections_no_holders
    url: https://www.aia.example.org/elecciones
    objective: Identify the members of the Asamblea del Istmo Austral's 2027-2028
      Mesa Directiva.
  expected_output:
    kind: miss
    reason: The page announces the 2027-2028 Mesa Directiva election process (call,
      calendar, electoral roll, candidacy deadlines) but names no board members
      or other position holders.
- name: nav_menu_hallucination
  inputs:
    fixture: nav_menu_hallucination
    url: https://www.maresia.example.org/o-compacto/organizacao
    objective: Identify the heads of the Maresia Compact Secretariat's departments
      and organizational units.
  expected_output:
    kind: miss
    reason: The page is a navigation menu plus a mission description; it lists
      curators and executive members by name under nav headings but names no
      department heads or unit leadership.
