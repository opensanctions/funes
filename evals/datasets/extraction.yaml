    reason: The capture contains only a transient 503 service-unavailable page.
- name: server_error_with_content
  inputs:
    fixture: server_error_with_content
    url: https://www.northstar.example.org/leadership
    people_sought: Leaders
    subject_label: Organization
    subject: Northstar Forum
    http_status: 503
