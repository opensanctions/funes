# yaml-language-server: $schema=extraction_schema.json
name: inspection
cases:
- name: office_of_the_sg
  inputs:
    fixture: office_of_the_sg
    url: https://www.caf.example.org/about/office-of-the-sg
    objective: Identify the leadership of the CAF Office of the Secretary-General.
  expected_output:
    kind: hit
    persons:
    - name: Mirela Voss
      positions:
      - name: Secretary-General
        organization: CAF
    - name: Tomas Lindqvist
      positions:
      - name: Chef de Cabinet
        organization: CAF
- name: roster_table
