- name: unexpected_redirect
  inputs:
    fixture: unexpected_redirect
    url: https://www.northstar.example.org/leadership
    people_sought: Leaders
    subject_label: Organization
    subject: Northstar Forum
    final_url: https://search.example.net/
  expected_output:
    kind: miss
    reason: The URL redirects to an unrelated search portal that contains no Northstar
      Forum leadership information.
- name: elections_no_holders
  inputs:
    fixture: elections_no_holders
    url: https://www.aia.example.org/elecciones
    people_sought: Members of the 2027-2028 Mesa Directiva
    subject_label: Organization
    subject: Asamblea del Istmo Austral
  expected_output:
