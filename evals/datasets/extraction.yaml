- name: wrong_subject_roster
  inputs:
    fixture: roster_table
    url: https://www.lbc.example.org/governance/delegates
    people_sought: Council delegates and alternates
    subject_label: Organization
    subject: Calder Sea Commission
  expected_output:
    kind: miss
    reason: The page lists delegates and alternates of the Lakes Basin Commission Council,
      not the Calder Sea Commission.
- name: bot_challenge
  inputs:
    fixture: bot_challenge
    url: https://www.nw-tribunal.example.org/secretariat/council
    people_sought: Judges and officeholders of the secretariat council
    subject_label: Organization
    subject: Northwest Tribunal
  expected_output:
    kind: broken
    reason: Bot-detection security challenge interstitial ("Just a moment...", "verifies you
      are not a bot"); no usable source content.
- name: not_found
  inputs:
    fixture: not_found
    url: https://www.nw-tribunal.example.org/secretariat/council
    people_sought: Judges and officeholders of the secretariat council
    subject_label: Organization
    subject: Northwest Tribunal
    http_status: 404
  expected_output:
    kind: miss
    reason: The URL returns a 404 page and therefore provides no council roster.
- name: account_login
  inputs:
    fixture: account_login
    url: https://members.nw-tribunal.example.org/secretariat/council
    people_sought: Judges and officeholders of the secretariat council
    subject_label: Organization
    subject: Northwest Tribunal
  expected_output:
    kind: miss
    reason: The page requires an existing member account and exposes no public council content.
