[project]
name = "funes"
version = "0.1.0"
description = "Orchestrate web capture and LLM extraction of political position holders into structured data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "click>=8.4.1",
    "fsspec[gcs]>=2026.6.0",
    "opensanctions-pravda>=0.1.6",
    "procrastinate==3.9.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai-slim[openai]>=2.33,<3",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pydantic-evals>=2.34.0",
    "pytest>=9.1.1",
    "ruff>=0.15.16",
]

[project.scripts]
funes = "funes.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
