# Funes-owned infrastructure for Pravda's in-process async client.
# The browser is external: PRAVDA_BROWSER_WS_URL points at any Playwright
# Chromium WebSocket endpoint, which is not a container here.
#
# With the defaults below, set in .env:
#   DATABASE_URL=postgresql+psycopg://pravda:pravda@localhost:5432/pravda
#   PRAVDA_BROWSER_WS_URL=ws://127.0.0.1:9222
#   PRAVDA_STORAGE_BASE_PATH=./storage
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pravda
      POSTGRES_PASSWORD: pravda
      POSTGRES_DB: pravda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravda -d pravda"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
